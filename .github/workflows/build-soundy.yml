name: Build Soundy Plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build soundy-plugin from upstream commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout soundy upstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lowkwrs/soundy
          ref: e2c5da8e96661d2a9eb96ee53e3d5b95903bc194
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :plugin:jar

      - name: Check artifact and SHA-256
        run: |
          ls -lh plugin/build/libs/
          sha256sum plugin/build/libs/*.jar

      - name: Upload soundy-plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soundy-plugin-1.1.0
          path: plugin/build/libs/soundy-plugin-1.1.0.jar
